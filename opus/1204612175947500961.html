<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>【新宿决战】现代最强vs史上最强</title>
<style>
/* 配色：浅色 / 深色，跟随系统切换 */
:root{--bg:#fff;--fg:#18191c;--text2:#61666d;--sub:#9499a0;--line:#e3e5e7;--box:#f1f2f3;--soft:#f6f7f8;--blue:#00aeec;--pink:#fb7299;--at:#008ac5}
.dark{--bg:#17181a;--fg:#e3e5e7;--text2:#a2a7ae;--sub:#757a81;--line:#2f3134;--box:#2f3134;--soft:#232527;--blue:#00aeec;--pink:#d44e7d;--at:#00a1d6}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;overflow-anchor:none;transition:background .2s}
#wrap{max-width:780px;margin:0 auto;padding:0 16px;background:var(--bg)}
body.held{overflow:hidden;height:100%}
body.held #wrap{position:fixed;top:0;left:0;right:0;will-change:transform}

/* 专栏文章：通栏封面 + 标题 + 作者行 + 话题 + 正文 */
.art{padding:0 0 22px}
.cover{display:block;width:calc(100% + 32px);margin:0 -16px 20px;aspect-ratio:16/9;object-fit:cover;background:var(--soft)}
.art h1{font-size:20px;line-height:1.5;margin:0 0 14px;font-weight:700}
.au{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.au .av{width:36px;height:36px}
.au .who{flex:1;display:flex;flex-direction:column;line-height:1.4}
.au .who b{font-size:14px;font-weight:600;color:var(--fg)}.au .who span{font-size:12px;color:var(--sub)}
.au .dots{font-style:normal;color:var(--sub);font-size:18px;padding:0 4px;cursor:pointer}
.topic{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--at);margin-bottom:10px;cursor:pointer}
.topic i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--at);color:#fff;font:700 10px/14px sans-serif;text-align:center;font-style:normal}
.art p{margin:0;font-size:16px;line-height:1.8}

/* 评论区头部 */
.chead{display:flex;align-items:center;padding:22px 0 18px}
.chead h2{font-size:24px;line-height:36px;font-weight:500;margin:0}
.chead .cnt{font-size:14px;color:var(--sub);margin:4px 30px 0 6px}
.sort{font-size:16px;color:var(--sub);cursor:pointer;user-select:none}.sort.on{color:var(--fg)}
.sort+i{display:inline-block;width:1px;height:11px;background:var(--sub);margin:0 12px;opacity:.6}
.cbox{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.cbox .av{width:40px;height:40px}
.input{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-end}
.input textarea{flex:1;min-width:0;height:50px;box-sizing:border-box;resize:none;border:1px solid transparent;border-radius:6px;background:var(--box);color:var(--fg);font:14px/20px inherit;font-family:inherit;padding:14px 12px;outline:none;transition:.2s}
.input textarea:focus{background:var(--bg);border-color:var(--blue);height:70px}
.input button{flex:none;height:32px;padding:0 14px;border:0;border-radius:4px;background:var(--blue);color:#fff;font-size:13px;cursor:pointer;opacity:.5}
.input button.ok{opacity:1}

/* 评论 */
.av{flex:none;border-radius:50%;object-fit:cover;background:var(--soft);display:block}
.cm{display:flex;gap:14px;padding-top:20px}
.cm>.avw .av{width:40px;height:40px}
@media (max-width:480px){.cm>.avw .av,.cbox .av{width:36px;height:36px}.cm{gap:12px}}
.cm>.main{flex:1;min-width:0;padding-bottom:14px;border-bottom:1px solid var(--line)}
.nm{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:21px;font-weight:500;color:var(--text2)}
.nm.vip{color:var(--pink)}
.lv{display:inline-block;font:italic 700 9px/11px Arial,sans-serif;color:#fff;border-radius:2px;padding:0 3px 0 2px;letter-spacing:-.2px}
.l0,.l1{background:#c0c0c0}.l2{background:#8bd29b}.l3{background:#7bcdef}.l4{background:#feb36d}.l5{background:#ff6c00}.l6{background:#f04c49}
.tag{font-size:12px;line-height:16px;color:var(--pink);border:1px solid var(--pink);border-radius:3px;padding:0 3px;margin-right:6px;font-weight:400}
.tx{font-size:15px;line-height:24px;white-space:pre-wrap;word-break:break-word;margin-top:4px}
.at{color:var(--at)}
.pic{display:block;width:180px;max-width:60%;border-radius:6px;margin:8px 0 2px;cursor:zoom-in}
.ft{display:flex;align-items:center;flex-wrap:wrap;gap:0 20px;margin-top:8px;font-size:13px;line-height:20px;color:var(--sub)}
.act{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.act:hover{color:var(--blue)}
.ic{width:16px;height:16px;display:block}
.act em{font-style:normal}
.ic path{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.act.on{color:var(--blue)}.act.on .ic path{fill:currentColor}
.hate .ic{transform:scaleY(-1)}

/* 头像：大会员右下角有个粉色"大" */
.avw{position:relative;flex:none;display:block;height:max-content}
.big{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;background:#fb7299;color:#fff;font:700 9px/15px sans-serif;text-align:center;font-style:normal;box-shadow:0 0 0 1.5px var(--bg)}
.up{font:700 10px/14px sans-serif;color:var(--pink);border:1px solid var(--pink);border-radius:3px;padding:0 3px;margin-right:6px;font-style:normal}
.kw{color:var(--at);cursor:pointer}.kw svg{width:9px;height:9px;vertical-align:6px;margin-left:1px}
.kw svg path{fill:none;stroke:currentColor;stroke-width:1.6}
.pics{display:flex;gap:4px;margin:8px 0 2px}.pics img{width:80px;height:80px;object-fit:cover;border-radius:6px}
.upl{display:inline-block;margin-top:8px;font-size:12px;line-height:18px;color:var(--sub);background:var(--box);border-radius:3px;padding:1px 6px}

/* 楼中楼：头像在左边，长回复换行后跟昵称对齐 */
.rp{margin-top:4px}
.ri{position:relative;padding:10px 0 0 34px}
.ri>.avw{position:absolute;left:0;top:10px}.ri .av{width:24px;height:24px}.ri .big{display:none}
.ri .line{font-size:15px;line-height:24px;word-break:break-word}
.ri .nm{font-size:13px;margin-right:8px;vertical-align:1px}
.ri .ft{margin-top:4px}
.more{font-size:13px;line-height:20px;color:var(--sub);padding-top:10px;user-select:none}
.more b{font-weight:400;cursor:pointer}.more b:hover{color:var(--blue)}
.more .cur{color:var(--blue)}.more .pg b,.more .pg span{margin:0 4px}
.rbox{margin-top:10px}
/* 滑过顶部输入框以后，底部常驻一条输入栏 */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s}
#dock.show{transform:none}
#dock .cbox{max-width:780px;margin:0 auto;padding:10px 16px;box-sizing:border-box}
#dock .av{width:40px;height:40px}#dock textarea{height:42px;padding:10px 12px}

/* 字符画评论：昵称 + 一张深色"配图"，配图里是字符画 */
.film{padding:14px 0 12px;border-bottom:1px solid var(--line)}
.film .head{height:22px;display:flex;align-items:center}
.shot{display:inline-block;background:#101012;border-radius:8px;padding:8px 6px;margin-top:6px}
.shot canvas{display:block}
/* 效果二：一张固定在屏幕正中的字符画评论，后面的评论在飞 */
#pin{display:none;position:fixed;left:0;right:0;z-index:15;pointer-events:none}
#pin .film{max-width:780px;margin:0 auto;padding:12px 16px;box-sizing:border-box;background:var(--bg);border:0;
  box-shadow:0 0 24px 12px var(--bg)}
.film.blur{filter:url(#vblur)}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="dock"></div>
<div id="pin"></div>
<svg width="0" height="0" style="position:absolute"><filter id="vblur"><feGaussianBlur stdDeviation="0 6"/></filter></svg>
<audio id="au" preload="auto" playsinline></audio>
<!-- 每格明暗存成的小黑白视频，只拿来读像素。不能 display:none，苹果手机对隐藏的视频不解码画面 -->
<video id="vd" preload="auto" muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page"
  style="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none"></video>
<script src="content.js"></script>
<script>
const RAMP = " .:-=+*#%@";                       // 从暗到亮
const INK = "#e8e8e8";                           // 配图里字符的颜色
const CHAR_PX = (devicePixelRatio || 1) >= 2 ? 2.5 : 4;   // 一个字多宽（像素）：手机屏幕密，字可以更小、格子更多
const SRC_RATIO = 84 / 300;                      // 小视频是 300 x 84 格
const FONT = "Consolas,Menlo,'Roboto Mono','Droid Sans Mono',monospace";
const FILM_CARDS = 7;                            // 字符画评论叠几条（盖满一屏再多一点）
const KEY = "wlkc-state";
// 放映时的"飞快往下刷"效果：0 = 原地不动；1 = 百叶窗；2 = 上下两头在飞；3 = 画面跟着跳。网址后面加 ?fx=1 可以临时切换
const FX = +(new URLSearchParams(location.search).get("fx") ?? "") || (CONTENT.fx || 0);                        // 刷新也记得的状态
const $ = id => document.getElementById(id);
const au = $("au"), vd = $("vd"), wrap = $("wrap");
const C = CONTENT;

// ================= 昼夜：跟随系统 =================
const mq = matchMedia("(prefers-color-scheme: dark)");
const applyTheme = () => document.documentElement.classList.toggle("dark",
  C.theme === "dark" || (C.theme !== "light" && mq.matches));
applyTheme();
mq.addEventListener ? mq.addEventListener("change", applyTheme) : mq.addListener(applyTheme);

// ================= 小工具 =================
const EMO = {"笑哭": "😂", "doge": "🐶", "大笑": "😆", "吃瓜": "🍉", "捂脸": "🤦", "微笑": "🙂", "辣眼睛": "🙈", "妙啊": "👍",
             "惊讶": "😲", "思考": "🤔", "哭": "😭", "生气": "😠", "疑惑": "😕", "OK": "👌", "保佑": "🙏", "打call": "📣", "叹气": "😔", "困": "😪", "委屈": "🥺"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const rich = s => esc(s).replace(/\[([^\]]{1,8})\]/g, (m, k) => EMO[k] || m)
                        .replace(/^回复 (@[^ :：]+) ?[:：]/, '回复 <span class="at">$1</span> :')
                        .replace(/(^|[^>])(@[^\s@:：，,。]{1,16})(?=[\s:：，,。]|$)/g, '$1<span class="at">$2</span>')
                        .replace(/\{([^{}]{1,12})\}/g, `<span class="kw">$1${LENS}</span>`);   // {词} = 蓝色搜索关键词
const AVATARS = 88;                              // avatars 文件夹里 a0~a39 是照片，a40~a87 是 AI 生成的二次元头像，按名字固定分配
const avIdx = n => [...n].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 9973, 7) % AVATARS;
const avSrc = n => `avatars/a${avIdx(n)}.jpg`;
const av = (n, vip) => `<span class="avw"><img class="av" src="${avSrc(n)}" alt="" loading="lazy">${vip ? '<i class="big">大</i>' : ""}</span>`;
const isUp = n => n === C.article.author;
const LENS = '<svg viewBox="0 0 10 10"><path d="M4.3 1.2a3.1 3.1 0 1 1 0 6.2 3.1 3.1 0 0 1 0-6.2zM6.6 6.6 9 9"/></svg>';
const nm = (n, lv, vip) => `<span class="nm${vip ? " vip" : ""}">${esc(n)}<i class="lv l${lv ?? 3}">LV${lv ?? 3}</i></span>`;
const fmtN = n => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(n);
// 点赞图标（照 B 站风格画的线条大拇指），点踩是它上下翻转
const THUMB = '<svg class="ic" viewBox="0 0 16 16"><path d="M5.3 7.1v6.6H3A1 1 0 0 1 2 12.7V8.1a1 1 0 0 1 1-1h2.3zm0 0 2.5-4.6c.3-.6 1-.8 1.6-.5.6.3.9 1 .7 1.6l-.7 2.5h3.5c1 0 1.7.9 1.5 1.8l-1 4.6c-.2.7-.8 1.2-1.5 1.2H5.3"/></svg>';
const actions = o => `<div class="ft"><span class="tm">${esc(o.time || "刚刚")}</span>
  <span class="act like" data-n="${o.likes || 0}">${THUMB}<em>${o.likes ? fmtN(o.likes) : ""}</em></span>
  <span class="act hate">${THUMB}</span><span class="act rep" data-to="${esc(o.name)}">回复</span>
  </div>${o.upLiked ? '<div class="upl">UP主觉得很赞</div>' : ""}`;

// 把"3小时前""10-09""2026-10-09 23:34"换成时间戳，给"最新"排序用
function ts(t) {
  const now = Date.now();
  if (!t || t === "刚刚") return now;
  let m;
  if ((m = t.match(/(\d+)分钟前/))) return now - m[1] * 6e4;
  if ((m = t.match(/(\d+)小时前/))) return now - m[1] * 36e5;
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/))) return new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 12), +(m[5] || 0)).getTime();
  if ((m = t.match(/^(\d{2})-(\d{2})/))) return new Date(new Date().getFullYear(), m[1] - 1, +m[2], 12).getTime();
  return 0;
}

// ================= 评论 =================
const reply = r => `<div class="ri">${av(r.name, r.vip)}<div class="line">${nm(r.name, r.lv, r.vip)}${isUp(r.name) ? '<i class="up">UP</i>' : ""}${rich(r.text)}</div>${actions(r)}</div>`;
function comment(c, opts = {}) {
  const shown = c.replies || [], all = c.all || shown;      // replies = 平时露出来的几条；all = 点开后的全部回复
  const total = c.rcount ?? all.length;
  const more = total > shown.length
    ? `<div class="more" data-n="${total}" data-seed="${c.likes}" data-op="${esc(c.name)}" data-shown="${esc(JSON.stringify(shown))}" data-preset="${esc(JSON.stringify(all))}">共${total}条回复，<b data-p="0">点击查看</b></div>` : "";
  const pics = c.images && c.images.length ? `<div class="pics">${c.images.map(u => `<img src="${u}" alt="" loading="lazy">`).join("")}</div>`
             : c.image ? `<img class="pic" src="${c.image}" alt="">` : "";
  return `<div class="cm" ${opts.id ? `id="${opts.id}"` : ""}>${av(c.name, c.vip)}<div class="main">
    ${nm(c.name, c.lv, c.vip)}<div class="tx">${c.top ? '<span class="tag">置顶</span>' : ""}${rich(c.text)}</div>
    ${pics}${actions(c)}
    <div class="rp">${shown.map(reply).join("")}${more}</div></div></div>`;
}

// 过渡评论：拿文案的句子，按比例把字换成同一个字，越往后换得越多、越长，最后一整墙
const allCopy = (COPY1 + COPY2).replace(/\s/g, "");
let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const fills = C.fillSteps.map((r, i) => {
  const len = 60 + i * 80, start = Math.floor(rnd() * (allCopy.length - len));
  // 按比例 r 把文案换成一句句"你中了啊……"：每一步要么写一整句，要么照抄一个字
  const src = [...allCopy.slice(start, start + len)], L = [...C.fillChar].length;
  const q = r >= 1 ? 1 : r / (L * (1 - r) + r);   // 让最后被替换掉的比例正好是 r
  let s = "";
  for (let k = 0; k < src.length;) { if (rnd() < q) { s += C.fillChar; k += L; } else s += src[k++]; }
  return {name: ["一只小柚o", C.launch.name][i % 2], lv: 5, likes: Math.floor(rnd() * 900), time: "刚刚", text: s};
});
const card = i => `<div class="film" ${i === 0 ? 'id="film0"' : ""}>
  <div class="head">${nm(C.filmName, 6)}</div><div class="shot"><canvas></canvas></div></div>`;

// 页面骨架：文章 → 评论区头 → 普通评论（可排序）→ 魔性文案和字符画（永远在最后）
const A = C.article;
wrap.innerHTML =
  `<div class="art">${A.cover ? `<img class="cover" src="${A.cover}" alt="">` : ""}<h1>${esc(A.title)}</h1>
     <div class="au">${av(A.author, A.vip)}<div class="who"><b>${esc(A.author)}</b><span>${esc(A.time)}</span></div><i class="dots">⋮</i></div>
     ${A.topic ? `<div class="topic"><i>#</i>${esc(A.topic)}</div>` : ""}
     <p>${rich(A.text)}</p></div>
   <div class="chead"><h2>评论</h2><span class="cnt">${C.totalComments}</span>
     <span class="sort on" data-s="hot">最热</span><i></i><span class="sort" data-s="new">最新</span></div>
   <div class="cbox" id="topbox">${av(C.me.name, C.me.vip)}<div class="input"><textarea placeholder="${esc(C.me.placeholder)}"></textarea><button>发布</button></div></div>
   <div id="list"></div>
   <div id="tail">` +
     comment(C.launch, {id: "trap"}) +
     fills.map((c, i) => comment(c, i === 0 ? {id: "fill0"} : {})).join("") +
     (C.preFilm ? comment(C.preFilm) : "") +
     Array.from({length: FILM_CARDS}, (_, i) => card(i)).join("") +
  `</div>`;
document.title = A.title;
$("dock").innerHTML = `<div class="cbox">${av(C.me.name, C.me.vip)}<div class="input"><textarea placeholder="${esc(C.me.placeholder)}"></textarea><button>发布</button></div></div>`;
new IntersectionObserver(([e]) => $("dock").classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0 && mode === "free"))
  .observe($("topbox"));

// 最热 = content.js 里写的顺序；最新 = 按时间倒序。魔性文案那一段永远在最后
const mine = [];                                   // 自己发的评论，置于最前
let sortBy = "hot";
function renderList() {
  const list = sortBy === "new" ? [...C.comments].sort((a, b) => ts(b.time) - ts(a.time)) : C.comments;
  $("list").innerHTML = mine.concat(list).map(c => comment(c)).join("");
  document.querySelectorAll(".sort").forEach(s => s.classList.toggle("on", s.dataset.s === sortBy));
}

// ================= 楼中楼：点"点击查看"展开，每页 10 条，可以翻页、收起 =================
const PER = 10;
function genReply(seedBase, i, op) {          // 第 i 条回复，同一楼同一位置永远一样
  let sd = (seedBase * 131 + i * 7919) % 2147483646 + 1;
  const r = () => (sd = sd * 16807 % 2147483647) / 2147483647;
  r(); r();
  const name = C.replyNames[Math.floor(r() * C.replyNames.length)];
  let text = C.replyPool[Math.floor(r() * C.replyPool.length)];
  if (r() < 0.35) text = `回复 @${r() < 0.4 ? op : C.replyNames[Math.floor(r() * C.replyNames.length)]} :` + text;
  const lv = r() < 0.5 ? 6 : r() < 0.7 ? 5 : 2 + Math.floor(r() * 3);
  const day = Math.max(1, 10 - Math.floor(i / 25)), hh = String(Math.floor(r() * 24)).padStart(2, "0"), mm = String(Math.floor(r() * 60)).padStart(2, "0");
  return {name, lv, vip: r() < 0.2, likes: Math.floor(Math.pow(r(), 3) * 800 / (1 + i / 10)), text,
          time: `2026-10-${String(day).padStart(2, "0")} ${hh}:${mm}`};
}
function showPage(m, page) {
  const n = +m.dataset.n, pages = Math.ceil(n / PER), sd = +m.dataset.seed || 1;
  const preset = JSON.parse(m.dataset.preset || "[]");
  let html = "";
  for (let i = page * PER; i < Math.min(n, (page + 1) * PER); i++)
    html += reply(i < preset.length ? preset[i] : genReply(sd, i, m.dataset.op));
  m.parentElement.querySelectorAll(".ri").forEach(el => el.remove());
  m.insertAdjacentHTML("beforebegin", html);
  if (pages <= 1) { m.innerHTML = `<b data-p="close">收起</b>`; return; }
  const nums = [];
  for (let p = 0; p < pages; p++)
    if (p < 2 || p >= pages - 2 || Math.abs(p - page) <= 1) nums.push(p);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  m.innerHTML = `<span class="pg">共${pages}页` + (page > 0 ? `<b data-p="${page - 1}">上一页</b>` : "") +
    nums.map(p => p === "…" ? "<span>…</span>" : p === page ? `<span class="cur">${p + 1}</span>` : `<b data-p="${p}">${p + 1}</b>`).join("") +
    (page < pages - 1 ? `<b data-p="${page + 1}">下一页</b>` : "") + `</span><b data-p="close">收起</b>`;
}
function collapse(m) {
  const preset = JSON.parse(m.dataset.shown || "[]");
  m.parentElement.querySelectorAll(".ri").forEach(el => el.remove());
  m.insertAdjacentHTML("beforebegin", preset.map(reply).join(""));
  m.innerHTML = `共${m.dataset.n}条回复，<b data-p="0">点击查看</b>`;
}

// ================= 点赞 / 点踩 / 回复 / 发评论 / 排序 =================
const inputBox = ph => `<div class="input rbox"><textarea placeholder="${esc(ph)}"></textarea><button>发布</button></div>`;
document.addEventListener("click", e => {
  if (mode === "auto" || mode === "film") return;
  const t = e.target;
  const s = t.closest(".sort");
  if (s) { if (s.dataset.s !== sortBy) { sortBy = s.dataset.s; renderList(); save(); } return; }
  const like = t.closest(".like");
  if (like) {
    const on = like.classList.toggle("on"), n = +like.dataset.n + (on ? 1 : 0);
    like.querySelector("em").textContent = n ? fmtN(n) : "";
    if (on) like.parentElement.querySelector(".hate").classList.remove("on");
    return;
  }
  const hate = t.closest(".hate");
  if (hate) {
    if (hate.classList.toggle("on")) {
      const l = hate.parentElement.querySelector(".like");
      if (l.classList.contains("on")) { l.classList.remove("on"); l.querySelector("em").textContent = +l.dataset.n ? fmtN(+l.dataset.n) : ""; }
    }
    return;
  }
  const rep = t.closest(".rep");
  if (rep) {                                       // 在这条评论（或楼中楼）下面弹出回复框
    const host = rep.closest(".main");
    const old = host.querySelector(":scope > .rbox");
    if (old) { old.remove(); return; }
    rep.closest(".ft").insertAdjacentHTML("afterend", inputBox(`回复 @${rep.dataset.to} :`));
    const box = rep.closest(".ft").nextElementSibling;
    host.appendChild(box); box.querySelector("textarea").focus();
    box.dataset.to = rep.dataset.to; box.dataset.sub = rep.closest(".ri") ? "1" : "";
    return;
  }
  const btn = t.closest(".input button");
  if (btn) {
    const ta = btn.parentElement.querySelector("textarea"), text = ta.value.trim();
    if (!text) return;
    const box = btn.closest(".input");
    if (box.classList.contains("rbox")) {          // 发楼中楼
      const r = {name: C.me.name, lv: C.me.lv, vip: C.me.vip, text: box.dataset.sub ? `回复 @${box.dataset.to} :${text}` : text, likes: 0, time: "刚刚"};
      box.closest(".main").querySelector(".rp").insertAdjacentHTML("beforeend", reply(r));
      box.remove();
    } else {                                       // 发主评论（底部栏发的也一样），发完回到评论区顶部看到自己那条
      mine.unshift({name: C.me.name, lv: C.me.lv, vip: C.me.vip, text, likes: 0, time: "刚刚", replies: []});
      ta.value = ""; btn.classList.remove("ok"); renderList();
      if (box.closest("#dock")) scrollTo(0, topIn($("list")) - 80);
    }
    return;
  }
  const m = t.closest(".more");
  if (m && t.dataset.p !== undefined) return t.dataset.p === "close" ? collapse(m) : showPage(m, +t.dataset.p);
});
document.addEventListener("input", e => {
  if (e.target.tagName === "TEXTAREA") e.target.parentElement.querySelector("button").classList.toggle("ok", !!e.target.value.trim());
});

// ================= 字符画评论 =================
const filmCards = [...document.querySelectorAll(".film")];
const canvasOf = c => c.querySelector("canvas");
const topIn = el => el.getBoundingClientRect().top - wrap.getBoundingClientRect().top;   // 元素离整页顶端多远
const px = document.createElement("canvas"), pctx = px.getContext("2d", {willReadFrequently: true});
let cols, rows, cellW, font, period = 300, canvasTop0 = 0, pinCanvas = null;
function layoutFilm() {                           // 配图铺满整行
  const dpr = devicePixelRatio || 1;
  const w = filmCards[0].clientWidth - 12;
  cols = Math.max(40, Math.floor(w / CHAR_PX)); rows = Math.round(cols * SRC_RATIO);
  px.width = cols; px.height = rows;
  const cssW = cols * CHAR_PX, cssH = rows * CHAR_PX * 2;
  for (const c of filmCards) {
    const cv = canvasOf(c);
    cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  }
  cellW = CHAR_PX * dpr;
  period = topIn(filmCards[1]) - topIn(filmCards[0]);         // 一条字符画评论有多高
  canvasTop0 = topIn(canvasOf(filmCards[0]));
  const ctx = canvasOf(filmCards[0]).getContext("2d");
  ctx.font = "100px " + FONT;
  font = 100 * cellW / ctx.measureText("M").width + "px " + FONT;
}
let lastVT = -1;
const master = document.createElement("canvas");  // 当前这一格字符画先画在这张"底片"上
function drawSource(t) {                          // 把第 t 秒的明暗画到小画布上；还没准备好就返回 false
  pctx.imageSmoothingQuality = "high";
  if (useSheets) {
    const k = Math.min(SHEET.frames - 1, Math.max(0, Math.floor(t * SHEET.fps)));
    const im = sheetImgs[Math.floor(k / SHEET.per)], j = k % SHEET.per;
    if (!im || !im.complete || !im.naturalWidth) return false;
    pctx.drawImage(im, (j % SHEET.gx) * SHEET.cols, Math.floor(j / SHEET.gx) * SHEET.rows, SHEET.cols, SHEET.rows, 0, 0, cols, rows);
    return true;
  }
  if (vd.readyState < 2) return false;
  pctx.drawImage(vd, 0, 0, cols, rows);
  return true;
}
function paintFrame(t) {                          // 读第 t 秒这一帧，亮的地方用密的字
  if (!drawSource(t)) return false;
  const cv0 = canvasOf(filmCards[0]);
  master.width = cv0.width; master.height = cv0.height;
  const d = pctx.getImageData(0, 0, cols, rows).data;
  const ctx = master.getContext("2d");
  ctx.clearRect(0, 0, master.width, master.height);
  ctx.fillStyle = INK; ctx.font = font; ctx.textBaseline = "middle";
  for (let y = 0; y < rows; y++) {
    let line = "";
    for (let x = 0; x < cols; x++) line += RAMP[Math.min(9, d[(y * cols + x) * 4] * 10 >> 8)];
    ctx.fillText(line, 0, (y + 0.5) * cellW * 2);
  }
  if (FX !== 1) {                                 // 效果一要按位置裁着画，在 film() 里每次刷新单独画
    for (const c of filmCards.concat(pinCanvas ? [pinCanvas.parentElement.parentElement] : [])) {
      const cv = canvasOf(c), c2 = cv.getContext("2d");
      c2.clearRect(0, 0, cv.width, cv.height); c2.drawImage(master, 0, 0);
    }
  }
  return true;
}
// 效果一：画面钉在屏幕正中不动，每条评论的配图框只露出跟画面重叠的那一截，像隔着往上卷的百叶窗看
function paintBlinds(off) {
  const dpr = devicePixelRatio || 1;
  const cssH = parseFloat(canvasOf(filmCards[0]).style.height);
  const fixedTop = (innerHeight - cssH) / 2;      // 画面在屏幕上的固定位置
  filmCards.forEach((c, i) => {
    const cv = canvasOf(c), c2 = cv.getContext("2d");
    const screenTop = canvasTop0 + i * period - (filmOffset + off);
    c2.clearRect(0, 0, cv.width, cv.height);
    const dy = (fixedTop - screenTop) * dpr;
    if (Math.abs(dy) < cv.height) c2.drawImage(master, 0, dy);
  });
}

// ================= 音视频：直接写地址；打开页面就在后台各请求一遍，存进浏览器缓存 =================
vd.src = "luma.mp4"; au.src = "audio.m4a";
fetch("luma.mp4").catch(() => {});
// 伴奏整首（约 400 KB）下进内存：开播不用等缓冲，网络断了也不会停
let audioMem = null;
fetch("audio.m4a").then(r => r.ok ? r.blob() : Promise.reject()).then(b => {
  audioMem = URL.createObjectURL(b);
  if (!playing) { au.src = audioMem; au.load(); }                  // 还没开播：直接换成内存里这份
  else if (!audioOn || au.error) recoverAudio(clock());            // 已经在放但没声音：马上用内存这份接上
}).catch(() => {});

// 微信不让小视频自己动起来，改用"印样"：每一帧缩成 120x34 的小格，480 格拼一张图，一共 3 张（make_sheets.py 生成）
// 网址加 ?sheet 可以在电脑上强制用这种方式测试；别的地方视频没动起来也会自动切过来
const SHEET = {cols: 120, rows: 34, per: 480, gx: 16, n: 3, fps: 15, frames: 1401};
let useSheets = /MicroMessenger/i.test(navigator.userAgent) || new URLSearchParams(location.search).has("sheet");
const sheetImgs = [];
function loadSheets() {
  if (sheetImgs.length) return;
  for (let i = 0; i < SHEET.n; i++) { const im = new Image(); im.src = `sheets/s${i}.webp`; sheetImgs.push(im); }
}
if (useSheets) loadSheets();

// ================= 刷新也记得：看到哪、有没有中招、视频播到哪 =================
let mode = "free", flyVT0 = 0;            // flyVT0：车轮效应从视频第几秒开始算（刷新后接着用）
function save(extra = {}) {
  try {
    sessionStorage.setItem(KEY, JSON.stringify(Object.assign({mode, sortBy, y: mode === "free" ? scrollY : 0, at: Date.now(), flyAt: flyVT0}, extra)));
  } catch (e) {}
}
let saved = null;
try { saved = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) {}
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
if (saved && saved.sortBy) sortBy = saved.sortBy;
renderList();
layoutFilm();
addEventListener("resize", () => { if (mode === "free") layoutFilm(); });

// ================= 全靠对方自己滑；离临界点越近，他每滑一下偷偷多送一段 =================
let lastY = scrollY, armed = false, saveT = 0;
addEventListener("scroll", () => {
  if (mode !== "free") return;
  const y = scrollY, dy = y - lastY;
  const boostTop = topIn($("fill0")) - innerHeight, film = topIn($("film0"));
  if (dy > 0 && y > boostTop) {
    const u = Math.min(1, (y - boostTop) / (film - boostTop));
    const extra = dy * C.boostMax * u * u;
    if (extra >= 1) scrollTo(0, y + extra);
  }
  lastY = scrollY;
  if (Date.now() - saveT > 300) { saveT = Date.now(); save(); }
  if (lastY >= film) return launch();                       // 惯性直接冲过头了，直接开
  if (lastY + innerHeight > film + 80) armed = true;          // 第一条字符画评论露头了：到临界点
}, {passive: true});

let touchY = null;                                            // 到了临界点，他再往下动一下就开播
addEventListener("wheel", e => { if (mode === "free" && armed && e.deltaY > 0) launch(); }, {passive: true});
addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, {passive: true});
addEventListener("touchmove", e => {
  if (mode === "free" && armed && touchY != null && touchY - e.touches[0].clientY > 8) launch();
}, {passive: true});

const block = e => { if (mode === "auto" || mode === "film") e.preventDefault(); };   // 放映期间不许滑
addEventListener("wheel", block, {passive: false});
addEventListener("touchmove", block, {passive: false});
addEventListener("keydown", e => { if ((mode === "auto" || mode === "film") && e.target.tagName !== "TEXTAREA") e.preventDefault(); });

// 一下子拽到字符画那里（0.22 秒，越来越快），同时开播
let filmOffset = 0, arriving = false;
function hold(at) {
  document.body.classList.add("held");
  scrollTo(0, 0);
  wrap.style.transform = `translateY(${-at}px)`;
}
function launch() {
  mode = "auto";
  $("dock").classList.remove("show");
  const from = scrollY;
  hold(from);
  filmOffset = topIn($("film0")) - 6;
  const t0 = performance.now();
  arriving = true;
  startFilm(0);
  const step = t => {
    const k = Math.min(1, (t - t0) / 220);
    wrap.style.transform = `translateY(${-(from + (filmOffset - from) * k * k)}px)`;
    if (k < 1) requestAnimationFrame(step); else { arriving = false; flyT0 = performance.now(); flyVT0 = clock(); }   // 拽到位了，效果从这一刻开始算
  };
  requestAnimationFrame(step);
}

// ================= 放映 =================
let audioOn = false, playing = false, startAt = 0, lastSave = 0, playT0 = 0;
let lastAuT = -1, lastAuWall = 0;                  // 伴奏上一次往前走是什么时候、走到了哪
function clock() {                                 // 现在该放到第几秒
  if (audioOn && (useSheets || !au.paused)) {
    const stall = performance.now() - lastAuWall;
    if (lastAuWall && stall > 300) return lastAuT + stall / 1000;   // 伴奏卡住了：按时间接着往前推
    return au.currentTime;
  }
  if (!useSheets) return vd.currentTime;
  return startAt + (performance.now() - playT0) / 1000;
}
function startFilm(t) {
  mode = "film"; startAt = t;
  save({t, mode: "film"});
  requestAnimationFrame(film);
}
function seek(m, t) {                              // 元数据没到时设 currentTime 会被忽略，等它到了再设
  if (m.readyState >= 1) m.currentTime = t;
  else m.addEventListener("loadedmetadata", () => { m.currentTime = t; }, {once: true});
}
function beginPlayback() {
  playing = true;
  playT0 = performance.now();
  vd.muted = true; au.muted = false;
  seek(au, startAt);
  if (!useSheets) { seek(vd, startAt); vd.play().catch(() => {}); }
  au.play().then(() => { audioOn = true; }).catch(() => {});   // 声音和画面同时直接开
}
au.addEventListener("pause", () => {               // 被系统或缓冲打断就自动续上
  if (playing && !au.ended) setTimeout(() => au.play().catch(() => {}), 60);
});
// 伴奏卡住或出错：换成内存里那份，从该放到的位置接着放
function recoverAudio(t) {
  if (!playing || au.ended) return;
  if (audioMem && au.src !== audioMem) au.src = audioMem;
  try { au.currentTime = t; } catch (e) {}
  au.play().then(() => { audioOn = true; }).catch(() => {});
}
au.addEventListener("error", () => { if (playing) recoverAudio(clock()); });
let flyT0 = 0;
function setupFx() {                              // 开播时按效果摆好场子
  layoutFilm();
  flyT0 = performance.now();
  if (FX === 2) {                                 // 复制一条字符画评论钉在屏幕正中，拖影只加在后面飞的那些上
    const pin = $("pin");
    pin.innerHTML = filmCards[0].outerHTML.replace('id="film0"', "");
    pinCanvas = canvasOf(pin);
    const src = canvasOf(filmCards[0]);
    pinCanvas.width = src.width; pinCanvas.height = src.height;
    pinCanvas.style.width = src.style.width; pinCanvas.style.height = src.style.height;
    pin.style.display = "block";
    pin.style.top = (innerHeight - pin.offsetHeight) / 2 + "px";
    filmCards.forEach(c => c.classList.add("blur"));
  }
}
function flyOffset(t) {                           // 字符画区域在开播位置基础上又往下滚了多少
  if (FX === 1 || FX === 2) return ((performance.now() - flyT0) / 1000 * (C.flySpeed || 1800)) % period;
  if (FX === 4) {                                 // 车轮效应：先像在往下退，再变成慢慢往上爬，同时轻轻跳
    const s = Math.max(0, t - flyVT0), T = C.wheelSettle || 2;     // 按视频播到哪算，刷新后不会重演倒转
    const down = -(C.wheelDown || 500), up = C.wheelUp || 45;      // 看起来的速度（像素/秒），负数是往下
    // 过渡曲线 k：2 秒内从 1 降到 0，先快后慢（三次方缓出）。速度和轻跳幅度都跟着它走
    const p = Math.min(1, s / T), k = Math.pow(1 - p, 3);
    // 速度 v = up + (down - up)·k，下面是它从开播到现在累计走了多远
    const phase = up * s + (down - up) * (T / 4) * (1 - Math.pow(1 - p, 4));
    const base = +(new URLSearchParams(location.search).get("jump") || C.wheelJump || 0.01);
    const size = base + ((C.wheelJumpReverse || 0.02) - base) * k;          // 倒转时 0.020，稳定后 0.010
    const jump = (t * (C.jumpRate || 15)) % 1 * period * size;
    return ((phase % period) + period) % period + jump;
  }
  if (FX === 3) {                                 // 每一格往上滑一段再跳回；网址加 &jump=0.1 可以临时改幅度
    const size = +(new URLSearchParams(location.search).get("jump") || C.jumpSize || 0.12);
    return (t * (C.jumpRate || 15)) % 1 * period * size;
  }
  return 0;
}
function film() {
  if (mode !== "film") return;
  if (!playing) { beginPlayback(); setupFx(); }
  if (audioOn) {                                  // 盯着伴奏：在走就记下来；0.8 秒没动就接上
    const now = performance.now();
    if (au.currentTime !== lastAuT) { lastAuT = au.currentTime; lastAuWall = now; }
    else if (now - lastAuWall > 800 && !au.ended) { const t0 = clock(); lastAuT = t0; lastAuWall = now; recoverAudio(t0); }
  }
  if (!useSheets && audioOn && !au.paused && Math.abs(vd.currentTime - clock()) > 0.2) vd.currentTime = clock();
  // 视频被拦住了（开播 1.5 秒还没动）：换成印样
  if (!useSheets && performance.now() - playT0 > 1500 && vd.currentTime < 0.05) { useSheets = true; loadSheets(); vd.pause(); }
  const t = clock();
  const key = useSheets ? Math.floor(t * SHEET.fps) : vd.currentTime;
  if (t > 0 && key !== lastVT && paintFrame(t)) lastVT = key;
  if (FX && !arriving) {
    const off = flyOffset(t);
    wrap.style.transform = `translateY(${-(filmOffset + off)}px)`;
    if (FX === 1 && lastVT !== -1) paintBlinds(off);
  }
  if (Date.now() - lastSave > 400) { lastSave = Date.now(); save({t}); }
  if (au.ended || t >= (C.duration || 93.4) - 0.05 || (!useSheets && vd.ended)) return finish();
  requestAnimationFrame(film);
}
function finish() {                                // 播完：停在最后一格，放开页面，可以接着往下滑
  mode = "done"; playing = false;
  au.pause(); vd.pause();
  $("pin").style.display = "none"; filmCards.forEach(c => c.classList.remove("blur"));
  if (FX === 1 && master.width) filmCards.forEach(c => { const cv = canvasOf(c); cv.getContext("2d").drawImage(master, 0, 0); });
  document.body.classList.remove("held");
  wrap.style.transform = "";
  scrollTo(0, filmOffset);
  save({mode: "done", y: filmOffset});
}

// ================= 刷新后接着来 =================
if (saved && (saved.mode === "film" || saved.mode === "auto")) {
  $("dock").classList.remove("show");
  const t = (saved.t || 0) + (Date.now() - saved.at) / 1000;      // 刷新那一两秒也算进去，像没停过
  filmOffset = topIn($("film0")) - 6;
  if (t < (C.duration || 93) - 0.5) { mode = "auto"; flyVT0 = saved.flyAt ?? 0.25; hold(filmOffset); startFilm(t); }
  else saved = {mode: "done"};
}
if (saved && saved.mode === "done") {
  filmOffset = topIn($("film0")) - 6;
  mode = "done";
  scrollTo(0, filmOffset);
  if (useSheets) {
    const last = sheetImgs[SHEET.n - 1], show = () => paintFrame((C.duration || 93.4) - 0.1);
    last.complete ? show() : last.addEventListener("load", show, {once: true});
  } else {
    vd.addEventListener("loadeddata", () => { vd.currentTime = Math.max(0, vd.duration - 0.1); }, {once: true});
    vd.addEventListener("seeked", () => paintFrame(vd.currentTime), {once: true});
  }
} else if (saved && saved.mode === "free" && saved.y) {
  scrollTo(0, saved.y); lastY = scrollY;
  addEventListener("load", () => { if (mode === "free") { scrollTo(0, saved.y); lastY = scrollY; } }, {once: true});
}

// ================= 声音兜底 =================
// 微信：在它的官方事件里先把视频和声音"暖"一下；刷新后正在播的话，借这个机会把声音接上
function tryAudio() {
  if (mode === "film" && playing && !audioOn) {
    au.currentTime = clock();
    au.play().then(() => { audioOn = true; }).catch(() => {});
  }
}
function wxReady() {
  if (mode === "free") {
    for (const m of useSheets ? [au] : [vd, au]) { m.muted = true; m.play().then(() => { m.pause(); m.currentTime = 0; if (m === au) m.muted = false; }).catch(() => {}); }
  } else tryAudio();
}
if (window.WeixinJSBridge) wxReady(); else document.addEventListener("WeixinJSBridgeReady", wxReady);
addEventListener("pointerdown", tryAudio, {capture: true});      // 浏览器硬拦了声音：碰一下屏幕就从同一位置补上
</script>
</body>
</html>
